<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lava</title><meta name="color-scheme" content="only light">
<link rel="stylesheet" href="assets/lava.css">
<style>
@font-face{font-family:'Bricolage Grotesque';src:url(assets/fonts/bricolage-grotesque-latin-wght-normal.woff2) format('woff2');font-weight:200 800;font-display:swap;unicode-range:U+0000-00FF,U+0131,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212}
@font-face{font-family:'Bricolage Grotesque';src:url(assets/fonts/bricolage-grotesque-vietnamese-wght-normal.woff2) format('woff2');font-weight:200 800;font-display:swap;unicode-range:U+0102-0103,U+0110-0111,U+0128-0129,U+0168-0169,U+01A0-01A1,U+01AF-01B0,U+0300-0301,U+0303-0304,U+0308-0309,U+0323,U+0329,U+1EA0-1EF9,U+20AB}

:root{--font:'Bricolage Grotesque',sans-serif;--bg:#fff;--fg:#0b0b0b;--muted:#5c5c5c;--line:#0b0b0b;--focus:#c92c05;--lava:#ff4a1c;
--radius-btn:0;--radius-card:0;--radius-field:0;--btn-bg:#0b0b0b;--btn-fg:#fff;--btn-hover:#ff4a1c;--btn-hover-fg:#0b0b0b;--off-bg:#e4e4e4;--off-fg:#5c5c5c;
--head-bg:#fff;--head-fg:#0b0b0b;--head-line:#0b0b0b;--field-bg:#fff;--field-line:#0b0b0b;--field-fg:#0b0b0b;--loi:#b3261e;--kq-tick:#fff}
.hero{padding-top:clamp(24px,4vw,48px)}
h1{font-size:clamp(64px,15.4vw,236px);line-height:.98;font-weight:700;letter-spacing:-.045em}
h1 mark{background:var(--lava);color:inherit;padding:0 .06em .02em}
.hero-luoi{display:grid;grid-template-columns:repeat(12,1fr);gap:24px;margin-top:clamp(24px,3vw,40px);align-items:end}
.tim{grid-column:1/-1;display:grid;grid-template-columns:repeat(3,1fr) auto;gap:0;border:1.5px solid var(--line)}
.tim .truong{padding:10px 16px 6px;border-right:1.5px solid var(--line)}
.tim .truong input,.tim .truong select{border:0;min-height:40px;padding-left:0;font-size:20px;font-weight:600}
.tim .btn{min-height:auto;font-size:20px;padding:0 44px}
.hero-anh{margin-top:24px}.hero-anh img{width:100%;height:clamp(280px,44vw,620px);object-fit:cover}
section{padding-top:clamp(64px,8vw,120px)}
.tieu{display:flex;align-items:baseline;justify-content:space-between;gap:24px;padding-bottom:16px;border-bottom:3px solid var(--line)}
h2{font-size:clamp(40px,6.6vw,96px);line-height:1.04;font-weight:700;letter-spacing:-.035em}
.dong{display:grid;grid-template-columns:132px 1.7fr 1.9fr .6fr .5fr minmax(190px,1.1fr) 24px;gap:24px;align-items:center;padding:16px 0;border-bottom:1.5px solid var(--line);width:100%;background:none;border-inline:0;border-top:0;text-align:left;cursor:pointer;transition:background-color .15s,padding .25s cubic-bezier(.25,1,.5,1)}
.dong:hover{background:var(--lava);padding-inline:16px}
.dong img{width:132px;height:88px;object-fit:cover}
.dong .ten{font-size:24px;line-height:1.25;font-weight:600}
.dong .gia{font-size:clamp(24px,2.1vw,30px);line-height:1.15;font-weight:700;text-align:right;letter-spacing:-.02em;white-space:nowrap}
.dong .mui{justify-self:end}
.khu{display:grid;grid-template-columns:repeat(3,1fr);margin-top:0}
.khu a{display:flex;flex-direction:column;justify-content:flex-end;min-height:44px;padding:24px 24px 24px 0;border-bottom:1.5px solid var(--line);font-size:clamp(36px,5vw,72px);line-height:1.1;font-weight:700;letter-spacing:-.03em;transition:color .15s}
.khu a+a{border-left:1.5px solid var(--line);padding-left:24px}
.khu a:hover{color:#c92c05}
.dat{display:grid;grid-template-columns:repeat(12,1fr);gap:24px;margin-top:32px}
.dat-anh{grid-column:1/7}.dat-anh img{width:100%;height:100%;min-height:360px;object-fit:cover}
.dat-form{grid-column:7/-1}
.form{display:grid;grid-template-columns:1fr 1fr;gap:12px 24px}.span{grid-column:1/-1}.form[hidden]{display:none}
.gui{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.chan{margin-top:clamp(64px,8vw,120px);background:#0b0b0b;color:#fff}.chan .wrap{display:flex;justify-content:space-between;align-items:center;min-height:96px}
.chan .logo{color:var(--lava)}
.chan a{min-height:44px;display:inline-flex;align-items:center}
@media (max-width:999px){
 .dong{grid-template-columns:96px 1fr auto;gap:4px 16px}.dong img{width:96px;height:96px;grid-row:1/4}
 .dong .ten{font-size:20px}.dong .kv-c,.dong .mui{display:none}.dong .dc{grid-column:2/-1}.dong .gia{grid-column:2/-1;text-align:left;font-size:24px}.dong .tt{grid-column:2/-1}
 .dong .ten{grid-column:2/-1}
 .tim{grid-template-columns:1fr}.tim .truong{border-right:0;border-bottom:1.5px solid var(--line)}.tim .btn{min-height:56px}
 .dat-anh{display:none}.dat-form{grid-column:1/-1}
}
@media (max-width:640px){.khu{grid-template-columns:1fr}.khu a+a{border-left:0;padding-left:0}.form{grid-template-columns:1fr}}

</style></head>
<body id="top">
<header class="head"><div class="wrap"><a class="logo" href="#top">LAVA</a>
<nav class="nav" id="menu"><a href="#nha-ban">Nhà bán</a><a href="#nha-cho-thue">Nhà cho thuê</a><a href="#khu-vuc">Khu vực</a><a href="#dat-lich-xem">Đặt lịch xem</a></nav>
<button class="nut-menu" aria-expanded="false" aria-controls="menu">Menu</button></div></header>
<main>
<section class="hero" style="padding-top:clamp(24px,4vw,48px)"><div class="wrap">
<h1><span style="display:block" data-rise><span>Tìm nhà</span></span><span style="display:block" data-rise><span style="--tre:80ms"><mark>đúng ý</mark></span></span></h1>
<div class="hero-luoi"><form class="tim" data-tim>
<label class="truong"><span>Nhu cầu</span><select name="nhu"><option value="mua">Mua</option><option value="thue">Thuê</option></select></label>
<label class="truong"><span>Loại nhà</span><select name="loai"><option value="">Mọi loại nhà</option><option>Căn hộ</option><option>Nhà phố</option><option>Biệt thự</option></select></label>
<label class="truong"><span>Khu vực</span><select name="khu"><option value="">Mọi khu vực</option><option>Hà Nội</option><option>TP.HCM</option><option>Đà Nẵng</option></select></label>
<button class="btn" type="submit">Tìm nhà</button></form></div>
<div class="hero-anh"><img src="assets/img/nha-vuon.webp" alt="Biệt thự hai tầng sáng đèn lúc chiều tối, sân cỏ và cây lớn" width="2000" height="1333"></div>
</div></section>
<section id="nha-ban"><div class="wrap"><div class="tieu"><h2>Nhà bán</h2></div><div class="bo-loc" data-boloc="mua" hidden><b></b><button class="lien-ket" data-xoa>Xóa bộ lọc</button></div>
<div class="ds" data-list="mua"></div>
<div class="rong" data-rong="mua" hidden><h3>Chưa có nhà bán phù hợp</h3><button class="lien-ket" data-xoa>Xóa bộ lọc</button></div></div></section>
<section id="nha-cho-thue"><div class="wrap"><div class="tieu"><h2>Nhà cho thuê</h2></div><div class="bo-loc" data-boloc="thue" hidden><b></b><button class="lien-ket" data-xoa>Xóa bộ lọc</button></div>
<div class="ds" data-list="thue"></div>
<div class="rong" data-rong="thue" hidden><h3>Chưa có nhà cho thuê phù hợp</h3><button class="lien-ket" data-xoa>Xóa bộ lọc</button></div></div></section>
<section id="khu-vuc"><div class="wrap"><div class="tieu"><h2>Khu vực</h2></div>
<div class="khu"><a href="#nha-ban" data-khu="Hà Nội">Hà Nội</a><a href="#nha-ban" data-khu="TP.HCM">TP.HCM</a><a href="#nha-ban" data-khu="Đà Nẵng">Đà Nẵng</a></div></div></section>
<section id="dat-lich-xem"><div class="wrap"><div class="tieu"><h2>Đặt lịch xem</h2></div>
<div class="dat"><div class="dat-anh"><img src="assets/img/phong-khach.webp" alt="Phòng khách sofa trắng, tường gỗ" width="1400" height="952" loading="lazy"></div><div class="dat-form"><form class="form" data-dat novalidate>
<label class="truong span"><span>Căn nhà</span><select name="nha"></select></label>
<label class="truong"><span>Họ và tên</span><input name="ten" autocomplete="name"></label>
<label class="truong"><span>Số điện thoại</span><input name="sdt" type="tel" inputmode="tel" autocomplete="tel"><small class="loi" data-loisdt></small></label>
<label class="truong"><span>Ngày xem</span><select name="ngay"></select></label>
<label class="truong"><span>Giờ xem</span><select name="gio"><option>09:00</option><option>14:00</option><option>16:00</option></select></label>
<div class="span gui"><button class="btn" type="submit">Đặt lịch</button><p class="ly-do" data-lydo role="status"></p></div>
</form>
<div class="kq" data-kq hidden role="status">
<svg class="kq-icon" viewBox="0 0 48 48" fill="none" aria-hidden="true"><circle cx="24" cy="24" r="24" fill="currentColor"/><path d="m14 25 7 7 13-15" stroke="var(--kq-tick)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
<h3>Đã đặt lịch</h3><dl class="kv"></dl><p>Vui lòng đến đúng giờ đã chọn.</p>
<div class="kq-nut"><button class="btn" data-xong>Xong</button><button class="btn btn-phu" data-them>Đặt thêm lịch</button></div></div></div></div></div></section>
</main><footer class="chan"><div class="wrap"><a class="logo" href="#top">LAVA</a><a href="#dat-lich-xem">Đặt lịch xem</a></div></footer>
<dialog class="ct" aria-label="Chi tiết căn nhà"></dialog>
<script>window.LAVA_MAU=(n)=>`<button class="dong" data-nha="${n.id}" aria-label="Xem ${n.ten}, ${n.dc}">${`<img src="assets/img/${n.img}.webp" alt="" width="132" height="88" loading="lazy">`}<span class="ten">${n.ten}</span><span class="dc">${n.dc}, ${n.khu}</span><span class="kv-c so">${n.dt} m²</span><span class="kv-c so">${n.pn} PN</span><span class="gia so">${n.gia}</span><svg class="mui" width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m7 4 6 6-6 6"/></svg></button>`;</script>
<script src="assets/lava.js"></script>
</body></html>
