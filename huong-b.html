<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lava</title><meta name="color-scheme" content="only light">
<link rel="stylesheet" href="assets/lava.css">
<style>
@font-face{font-family:'Archivo';src:url(assets/fonts/archivo-latin-wdth-normal.woff2) format('woff2');font-weight:100 900;font-display:swap;font-stretch:62% 125%;unicode-range:U+0000-00FF,U+0131,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212}
@font-face{font-family:'Archivo';src:url(assets/fonts/archivo-vietnamese-wdth-normal.woff2) format('woff2');font-weight:100 900;font-display:swap;font-stretch:62% 125%;unicode-range:U+0102-0103,U+0110-0111,U+0128-0129,U+0168-0169,U+01A0-01A1,U+01AF-01B0,U+0300-0301,U+0303-0304,U+0308-0309,U+0323,U+0329,U+1EA0-1EF9,U+20AB}

:root{--font:'Archivo',sans-serif;--bg:#0e0d0c;--fg:#f6f3ee;--muted:#b9b4ab;--line:#35322e;--focus:#ff6a33;--lava:#ff5a1f;
--radius-btn:0;--radius-card:0;--radius-field:0;--btn-bg:#ff5a1f;--btn-fg:#0e0d0c;--btn-hover:#ffa17c;--off-bg:#2b2926;--off-fg:#b9b4ab;
--head-bg:#0e0d0c;--head-fg:#f6f3ee;--head-line:#0e0d0c;--field-bg:#1a1917;--field-line:#55514b;--field-fg:#f6f3ee;--loi:#ff9a8f;--kq-tick:#0e0d0c}
.cao{font-stretch:62%;font-weight:800;text-transform:uppercase;letter-spacing:-.005em}
.logo{font-stretch:62%;font-size:30px;letter-spacing:.02em}
.hero{position:relative;min-height:calc(100svh - 72px);display:flex;flex-direction:column;justify-content:flex-end;color:#fff;background:#0e0d0c;overflow:hidden}
.hero>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:brightness(.58)}
.hero .wrap{position:relative;width:100%;padding-bottom:0}
h1{font-size:clamp(84px,15.2vw,262px);line-height:1;white-space:nowrap}
@media (max-width:640px){h1{white-space:normal;font-size:27vw}}
.tim{display:grid;grid-template-columns:repeat(3,1fr) auto;background:#fff;color:#0e0d0c;margin-top:clamp(16px,2vw,24px)}
.tim .truong{padding:10px 16px 6px;border-right:1px solid #d9d9d9}
.tim .truong>span{color:#5c5c5c}
.tim .truong select{background-color:#fff;color:#0e0d0c;border:0;min-height:40px;padding-left:0;font-size:19px;font-weight:600}
.tim .btn{min-height:auto;padding:0 44px;font-size:22px;font-stretch:75%;font-weight:800;text-transform:uppercase}
section{padding-top:clamp(72px,10vw,160px)}
h2{font-size:clamp(56px,10vw,168px);line-height:1;margin-bottom:clamp(24px,3vw,48px)}
.ds[data-list=mua]{display:grid;grid-template-columns:repeat(12,1fr);gap:clamp(40px,5vw,72px) 24px}
.the{display:block;width:100%;padding:0;background:none;border:0;color:inherit;text-align:left;cursor:pointer}
.the .khung{overflow:hidden}.the img{width:100%;object-fit:cover;transition:transform .8s cubic-bezier(.165,.84,.44,1)}
.the:hover img{transform:scale(1.04)}
.the .hang{display:flex;justify-content:space-between;align-items:baseline;gap:16px;margin-top:12px}
.the .ten{font-size:clamp(28px,3vw,44px);line-height:1.08}
.the .gia{font-size:clamp(28px,3vw,44px);line-height:1.08;color:var(--lava);white-space:nowrap}
.the .dc{color:var(--muted);margin-top:4px;text-wrap:pretty}
.ds[data-list=mua] .the:nth-child(4n+1){grid-column:1/8}.ds[data-list=mua] .the:nth-child(4n+1) img{aspect-ratio:7/5}
.ds[data-list=mua] .the:nth-child(4n+2){grid-column:9/-1;margin-top:clamp(48px,10vw,160px)}.ds[data-list=mua] .the:nth-child(4n+2) img{aspect-ratio:4/5}
.ds[data-list=mua] .the:nth-child(4n+3){grid-column:2/6}.ds[data-list=mua] .the:nth-child(4n+3) img{aspect-ratio:4/5}
.ds[data-list=mua] .the:nth-child(4n){grid-column:6/-1;margin-top:clamp(40px,6vw,96px)}.ds[data-list=mua] .the:nth-child(4n) img{aspect-ratio:7/5}
.ds[data-list=mua] .the:nth-child(5){grid-column:1/-1;margin-top:0}.ds[data-list=mua] .the:nth-child(5) img{aspect-ratio:21/9}
.ds[data-list=thue]{display:grid;grid-template-columns:repeat(3,1fr);gap:24px}.ds[data-list=thue] img{aspect-ratio:4/3}
.ds[data-list=thue] .ten,.ds[data-list=thue] .gia{font-size:clamp(24px,2.2vw,32px)}.ds[data-list=thue] .hang{flex-direction:column;gap:4px}
.ds[hidden]{display:none}
.no-anh{position:relative;margin-top:clamp(72px,10vw,160px);padding:0;height:clamp(320px,62vw,860px);overflow:hidden;background:#0e0d0c}
.no-anh img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;clip-path:inset(calc((1 - var(--p,0))*22%) calc((1 - var(--p,0))*26%));will-change:clip-path}
.khu{display:grid;grid-template-columns:repeat(3,1fr);gap:24px}
.khu a{position:relative;display:block;aspect-ratio:3/4;overflow:hidden;color:#fff}
.khu img{width:100%;height:100%;object-fit:cover;filter:brightness(.62);transition:transform .8s cubic-bezier(.165,.84,.44,1)}
.khu a:hover img{transform:scale(1.04)}
.khu span{position:absolute;left:20px;bottom:12px;font-size:clamp(40px,5vw,80px);line-height:1.05}
#dat-lich-xem{margin-top:clamp(72px,10vw,160px);padding:clamp(48px,6vw,96px) 0;background:var(--lava);color:#0e0d0c;--muted:#0e0d0c;--field-bg:#fff;--field-line:#0e0d0c;--field-fg:#0e0d0c;--btn-bg:#0e0d0c;--btn-fg:#f6f3ee;--btn-hover:#3a3733;--off-bg:#0e0d0c;--off-fg:#f6f3ee;--loi:#0e0d0c;--kq-tick:#ff5a1f}
.dat{display:grid;grid-template-columns:repeat(12,1fr);gap:24px}.dat h2{grid-column:1/7;margin:0}.dat-form{grid-column:7/-1}
.form{display:grid;grid-template-columns:1fr 1fr;gap:12px 24px}.span{grid-column:1/-1}.form[hidden]{display:none}
.gui{display:flex;align-items:center;gap:16px;flex-wrap:wrap}.gui .btn[disabled]{opacity:1}
.ly-do{color:#0e0d0c;font-weight:500}
.chan .wrap{display:flex;justify-content:space-between;align-items:center;min-height:96px}.chan a{min-height:44px;display:inline-flex;align-items:center}
.nut-menu{color:#f6f3ee}
@media (max-width:839px){
 .tim{grid-template-columns:1fr}.tim .truong{border-right:0;border-bottom:1px solid #d9d9d9}.tim .btn{min-height:56px}
 .ds[data-list=mua] .the:nth-child(n){grid-column:1/-1;margin-top:0}.ds[data-list=mua] .the:nth-child(n) img{aspect-ratio:4/3}
 .ds[data-list=thue]{grid-template-columns:1fr}
 .khu{grid-template-columns:1fr}.khu a{aspect-ratio:16/9}
 .dat h2,.dat-form{grid-column:1/-1}.form{grid-template-columns:1fr}
}

</style></head>
<body id="top">
<header class="head"><div class="wrap"><a class="logo" href="#top">LAVA</a>
<nav class="nav" id="menu"><a href="#nha-ban">Nhà bán</a><a href="#nha-cho-thue">Nhà cho thuê</a><a href="#khu-vuc">Khu vực</a><a href="#dat-lich-xem">Đặt lịch xem</a></nav>
<button class="nut-menu" aria-expanded="false" aria-controls="menu">Menu</button></div></header>
<main>
<div class="hero"><img src="assets/img/nha-vuon.webp" alt="Biệt thự hai tầng sáng đèn lúc chiều tối" width="2000" height="1333">
<div class="wrap"><h1 class="cao"><span style="display:block" data-rise><span>Tìm nhà <wbr>đúng ý</span></span></h1>
<form class="tim" data-tim>
<label class="truong"><span>Nhu cầu</span><select name="nhu"><option value="mua">Mua</option><option value="thue">Thuê</option></select></label>
<label class="truong"><span>Loại nhà</span><select name="loai"><option value="">Mọi loại nhà</option><option>Căn hộ</option><option>Nhà phố</option><option>Biệt thự</option></select></label>
<label class="truong"><span>Khu vực</span><select name="khu"><option value="">Mọi khu vực</option><option>Hà Nội</option><option>TP.HCM</option><option>Đà Nẵng</option></select></label>
<button class="btn" type="submit">Tìm nhà</button></form></div></div>
<section id="nha-ban"><div class="wrap"><h2 class="cao">Nhà bán</h2><div class="bo-loc" data-boloc="mua" hidden><b></b><button class="lien-ket" data-xoa>Xóa bộ lọc</button></div>
<div class="ds" data-list="mua"></div>
<div class="rong" data-rong="mua" hidden><h3>Chưa có nhà bán phù hợp</h3><button class="lien-ket" data-xoa>Xóa bộ lọc</button></div></div></section>
<div class="no-anh-gio" hidden></div><div class="no-anh" data-p><img src="assets/img/bep.webp" alt="Bếp trắng với quầy đảo và hai đèn thả" width="1400" height="930" loading="lazy"></div>
<section id="nha-cho-thue"><div class="wrap"><h2 class="cao">Nhà cho thuê</h2><div class="bo-loc" data-boloc="thue" hidden><b></b><button class="lien-ket" data-xoa>Xóa bộ lọc</button></div>
<div class="ds" data-list="thue"></div>
<div class="rong" data-rong="thue" hidden><h3>Chưa có nhà cho thuê phù hợp</h3><button class="lien-ket" data-xoa>Xóa bộ lọc</button></div></div></section>
<section id="khu-vuc"><div class="wrap"><h2 class="cao">Khu vực</h2>
<div class="khu"><a href="#nha-ban" data-khu="Hà Nội"><img src="assets/img/can-ho-ngoai.webp" alt="" width="1400" height="933" loading="lazy"><span class="cao">Hà Nội</span></a>
<a href="#nha-ban" data-khu="TP.HCM"><img src="assets/img/thap.webp" alt="" width="1400" height="933" loading="lazy"><span class="cao">TP.HCM</span></a>
<a href="#nha-ban" data-khu="Đà Nẵng"><img src="assets/img/nha-doc.webp" alt="" width="1000" height="1500" loading="lazy"><span class="cao">Đà Nẵng</span></a></div></div></section>
<section id="dat-lich-xem"><div class="wrap dat"><h2 class="cao">Đặt lịch xem</h2><div class="dat-form"><form class="form" data-dat novalidate>
<label class="truong span"><span>Căn nhà</span><select name="nha"></select></label>
<label class="truong"><span>Họ và tên</span><input name="ten" autocomplete="name"></label>
<label class="truong"><span>Số điện thoại</span><input name="sdt" type="tel" inputmode="tel" autocomplete="tel"><small class="loi" data-loisdt></small></label>
<label class="truong"><span>Ngày xem</span><select name="ngay"></select></label>
<label class="truong"><span>Giờ xem</span><select name="gio"><option>09:00</option><option>14:00</option><option>16:00</option></select></label>
<div class="span gui"><button class="btn" type="submit">Đặt lịch</button><p class="ly-do" data-lydo role="status"></p></div>
</form>
<div class="kq" data-kq hidden role="status">
<svg class="kq-icon" viewBox="0 0 48 48" fill="none" aria-hidden="true"><circle cx="24" cy="24" r="24" fill="currentColor"/><path d="m14 25 7 7 13-15" stroke="var(--kq-tick)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
<h3>Đã đặt lịch</h3><dl class="kv"></dl><p>Vui lòng đến đúng giờ đã chọn.</p>
<div class="kq-nut"><button class="btn" data-xong>Xong</button><button class="btn btn-phu" data-them>Đặt thêm lịch</button></div></div></div></div></section>
</main><footer class="chan"><div class="wrap"><a class="logo" href="#top">LAVA</a><a href="#dat-lich-xem">Đặt lịch xem</a></div></footer>
<dialog class="ct" aria-label="Chi tiết căn nhà"></dialog>
<script>window.LAVA_MAU=(n)=>`<button class="the" data-nha="${n.id}" data-len aria-label="Xem ${n.ten}, ${n.dc}"><div class="khung"><img src="assets/img/${n.img}.webp" alt="" width="1400" height="933" loading="lazy"></div><div class="hang"><span class="ten cao">${n.ten}</span><span class="gia cao so">${n.gia}</span></div><p class="dc">${n.dc}, ${n.khu}. ${n.dt} m², ${n.pn} phòng ngủ</p></button>`;</script>
<script src="assets/lava.js"></script>
</body></html>
